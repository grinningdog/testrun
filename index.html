<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie & TV Collection</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="My personal movie and TV collection">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Collection">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; min-height: 100vh; color: #fff; padding: 20px; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .container { max-width: 1400px; margin: 0 auto; }
        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding: 0 20px; }
        .main-tab { padding: 15px 30px; background: none; border: none; color: #888; cursor: pointer; font-size: 18px; font-weight: bold; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .main-tab.active { color: #e50914; border-bottom-color: #e50914; }
        .main-tab:hover { color: #fff; }
        .tab-content-section { display: none; }
        .tab-content-section.active { display: block; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 20px; flex-wrap: wrap; gap: 15px; }
        .header-left { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        h1 { font-size: 2rem; color: #fff; display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
        .movie-count { color: #888; font-size: 1.2rem; font-weight: normal; }
        .last-updated { font-size: 12px; color: #666; }
        .sync-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 8px; }
        .sync-status.ok { background: #2e7d32; color: white; }
        .sync-status.error { background: #d32f2f; color: white; }
        .sync-status.loading { background: #333; color: #ccc; }
        .btn { background: #e50914; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:hover { background: #f40612; transform: translateY(-2px); }
        .btn-secondary { background: #333; }
        .btn-secondary:hover { background: #444; }
        .btn-success { background: #2e7d32; }
        .btn-success:hover { background: #1b5e20; }
        .btn-small { padding: 8px 16px; font-size: 14px; }
        .header-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .mobile-menu-toggle { display: none; background: #e50914; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .genre-dropdown { display: none; padding: 12px 20px; font-size: 16px; border: 2px solid #333; border-radius: 30px; background: #1a1a1a; color: #fff; cursor: pointer; }
        .genre-dropdown:focus { outline: none; border-color: #e50914; }
        .genre-dropdown option { background: #1a1a1a; color: #fff; }
        .controls { margin-bottom: 20px; padding: 0 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; max-width: 500px; padding: 12px 20px; font-size: 16px; border: 2px solid #333; border-radius: 30px; background: #1a1a1a; color: #fff; }
        .search-input:focus { outline: none; border-color: #e50914; background: #222; }
        .search-input::placeholder { color: #888; }
        .sort-select { padding: 12px 20px; font-size: 16px; border: 2px solid #333; border-radius: 30px; background: #1a1a1a; color: #fff; cursor: pointer; min-width: 200px; }
        .sort-select option { background: #1a1a1a; color: #fff; }
        .genre-filter-bar { margin-bottom: 20px; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
        .genre-filter-label { color: #888; font-size: 14px; margin-right: 5px; font-weight: bold; }
        .genre-chip { padding: 6px 14px; background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .genre-chip:hover { background: #333; color: #fff; border-color: #e50914; }
        .genre-chip.active { background: #e50914; color: #fff; border-color: #e50914; font-weight: bold; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 1200px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }
        .movie-card { position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; background: #1a1a1a; box-shadow: 0 4px 15px rgba(0,0,0,0.5); aspect-ratio: 2/3; }
        .movie-card:hover { transform: scale(1.05); box-shadow: 0 15px 35px rgba(229,9,20,0.3); z-index: 10; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .movie-card-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, transparent 100%); padding: 30px 10px 10px; transition: all 0.3s; }
        .movie-card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .movie-card-year { font-size: 12px; color: #ccc; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .movie-card-rating { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #ffd700; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .movie-card:hover .movie-card-overlay { padding: 40px 10px 10px; }
        .movie-card-genres { font-size: 11px; color: #e50914; margin-top: 4px; opacity: 0; max-height: 0; transition: all 0.3s; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .movie-card:hover .movie-card-genres { opacity: 1; max-height: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border-radius: 12px; padding: 30px; max-width: 900px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; border: 1px solid #333; color: #fff; }
        .actor-modal-content { max-width: 420px; text-align: center; }
        .actor-details { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .actor-details img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; }
        .actor-details h2 { color: #e50914; margin: 0; font-size: 1.6rem; }
        .actor-character { color: #888; font-size: 14px; font-style: italic; }
        .actor-tmdb-link { display: inline-block; background: #000; color: #4dd0e1; text-decoration: none; padding: 10px 20px; border-radius: 6px; border: 1px solid #333; font-weight: bold; margin-top: 10px; }
        .actor-tmdb-link:hover { background: #e50914; color: white; border-color: #e50914; }
        #addModal .modal-content { display: flex; flex-direction: column; padding: 20px 25px; overflow: hidden; }
        #addModal .modal-close { z-index: 20; }
        #addModal h2 { margin-bottom: 15px; padding-right: 40px; flex-shrink: 0; }
        #addModal .tabs { margin-bottom: 15px; flex-shrink: 0; }
        #addModal .tab-content { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
        #addModal .tab-content.active { display: flex; }
        #addModal .form-group { margin-bottom: 15px; flex-shrink: 0; }
        #addModal .search-results, #addModal #personItemResults { flex: 1; min-height: 0; overflow-y: auto; margin-top: 0; }
        #addModal #personItemsSection { display: none; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
        #addModal #personItemsSection[style*="flex"] { display: flex !important; }
        #addModal .person-items-header { flex-shrink: 0; margin: 0 0 10px 0; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; z-index: 10; }
        .modal-close:hover { background: #333; }
        .modal h2 { margin-bottom: 20px; color: #e50914; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background: #000; color: #fff; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #e50914; }
        .help-text { font-size: 14px; color: #888; margin-top: 5px; }
        .search-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; max-height: 500px; overflow-y: auto; }
        .search-result-item { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; background: #000; border: 2px solid transparent; transition: all 0.3s; display: flex; flex-direction: column; height: 280px; }
        .search-result-item:hover { border-color: #e50914; transform: scale(1.02); }
        .search-result-item img { width: 100%; height: 225px; object-fit: cover; display: block; flex-shrink: 0; }
        .search-result-info { padding: 10px; background: #000; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .search-result-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-year { font-size: 12px; color: #888; }
        .add-btn-small { position: absolute; top: 5px; right: 5px; background: #e50914; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 2; }
        .search-result-item:hover .add-btn-small { opacity: 1; }
        .add-btn-small.added { background: #2e7d32; opacity: 1; }
        .search-loading, .search-no-results { text-align: center; padding: 40px; color: #888; grid-column: 1/-1; }
        .person-results { display: none; flex-direction: column; gap: 10px; margin-top: 20px; max-height: 300px; overflow-y: auto; flex-shrink: 0; }
        .person-results.show { display: flex; }
        .person-result-item { display: flex; align-items: center; gap: 15px; padding: 10px; background: #000; border: 1px solid #333; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .person-result-item:hover { border-color: #e50914; background: #222; }
        .person-result-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .person-result-info { flex: 1; }
        .person-result-name { font-size: 16px; font-weight: bold; margin-bottom: 3px; }
        .person-result-known { font-size: 12px; color: #888; }
        .person-items-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; padding: 10px; background: #000; border-radius: 8px; }
        .person-items-header h3 { color: #e50914; font-size: 18px; }
        .add-all-btn { background: #2e7d32; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .add-all-btn:hover { background: #1b5e20; }
        .add-all-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }
        .person-filters { background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-top: 15px; display: none; }
        .person-filters.show { display: block; }
        .filter-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: end; margin-bottom: 10px; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 12px; color: #888; font-weight: normal; }
        .filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid #333; border-radius: 4px; background: #1a1a1a; color: #fff; font-size: 14px; min-width: 120px; }
        .filter-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #ccc; }
        .filter-checkbox input[type="checkbox"] { width: 16px; height: 16px; }
        .apply-filters-btn { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; align-self: flex-end; }
        .clear-filters-btn { background: #333; color: #ccc; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; align-self: flex-end; }
        .movie-details { display: flex; flex-direction: column; gap: 15px; }
        .movie-details img { width: 100%; max-width: 300px; border-radius: 8px; align-self: center; }
        .movie-details h2 { font-size: 1.8rem; margin-bottom: 10px; color: #e50914; }
        .movie-meta { display: flex; gap: 20px; color: #ccc; font-size: 14px; flex-wrap: wrap; }
        .movie-rating { color: #ffd700; }
        .movie-synopsis { line-height: 1.6; margin-top: 10px; }
        .movie-actors { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: #ccc; margin-top: 5px; }
        .movie-actors-label { color: #888; font-size: 13px; margin-right: 4px; }
        .actor-chip { cursor: pointer; color: #fff; transition: color 0.2s; padding: 2px 0; }
        .actor-chip:hover { color: #e50914; text-decoration: underline; }
        .actor-separator { color: #555; user-select: none; }
        .user-rating-section { background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .user-rating-label { font-size: 14px; color: #ccc; margin-bottom: 8px; font-weight: bold; }
        .star-rating { display: flex; gap: 5px; align-items: center; }
        .star { font-size: 32px; cursor: pointer; color: #333; transition: all 0.2s; user-select: none; }
        .star:hover { transform: scale(1.2); }
        .star.filled { color: #ffd700; }
        .star.hover-preview { color: #ffed4e; }
        .rating-text { margin-left: 10px; color: #888; font-size: 14px; }
        .clear-rating { background: none; border: 1px solid #444; color: #888; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        .clear-rating:hover { border-color: #e50914; color: #e50914; }
        .delete-btn { background: #333; color: #ff6b6b; border: 1px solid #444; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .delete-btn:hover { background: #d32f2f; color: #fff; border-color: #d32f2f; }
        .empty-state { text-align: center; padding: 60px 20px; color: #888; grid-column: 1/-1; }
        .empty-state h2 { margin-bottom: 10px; color: #fff; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; }
        .tab { padding: 10px 20px; background: none; border: none; color: #888; cursor: pointer; font-size: 16px; font-weight: bold; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
        .tab.active { color: #e50914; border-bottom-color: #e50914; }
        .tab:hover { color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-filter-notice { text-align: center; padding: 10px; margin: 0 20px 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #ccc; font-size: 14px; display: none; }
        .active-filter-notice.show { display: block; }
        .active-filter-notice strong { color: #e50914; }
        .back-to-top { position: fixed; bottom: 30px; right: 30px; background: #e50914; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 999; border: none; font-size: 24px; }
        .back-to-top.visible { opacity: 1; visibility: visible; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #1a1a1a; border: 1px solid #333; border-left: 4px solid #e50914; color: #fff; padding: 15px 20px; border-radius: 6px; min-width: 280px; max-width: 400px; animation: slideIn 0.3s ease-out; display: flex; align-items: center; gap: 10px; }
        .toast.success { border-left-color: #2e7d32; }
        .toast.error { border-left-color: #d32f2f; }
        .toast.info { border-left-color: #4dd0e1; }
        .toast-icon { font-size: 20px; }
        .toast-message { flex: 1; font-size: 14px; }
        .toast.fade-out { animation: fadeOut 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .main-tabs { padding: 0 10px; }
            .main-tab { padding: 12px 20px; font-size: 16px; }
            .header { padding: 0 10px; flex-wrap: nowrap; align-items: flex-start; }
            .header-left { min-width: 0; }
            h1 { font-size: 1.4rem; }
            .movie-count { font-size: 1rem; }
            .mobile-menu-toggle { display: block; flex-shrink: 0; margin-left: 10px; }
            .header-buttons { display: none; width: 100%; flex-direction: column; gap: 8px; margin-top: 10px; }
            .header-buttons.show { display: flex; }
            .header-buttons .btn { width: 100%; text-align: center; }
            .genre-filter-bar { display: none; }
            .genre-dropdown { display: block; width: 100%; margin: 0 10px 15px; }
            .controls { flex-direction: column; padding: 0 10px; }
            .search-input, .sort-select { width: 100%; max-width: none; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; }
            .search-results { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .search-result-item { height: 230px; }
            .search-result-item img { height: 170px; }
            .star { font-size: 28px; }
            .modal { padding: 10px; }
            #addModal .modal-content { max-height: 95vh; padding: 15px; }
            #addModal h2 { font-size: 1.4rem; }
            #addModal .tab { padding: 8px 12px; font-size: 13px; }
            .actor-details img { width: 150px; height: 150px; }
            .toast-container { top: 10px; right: 10px; left: 10px; }
            .toast { min-width: auto; max-width: none; }
            .back-to-top { bottom: 20px; right: 20px; width: 44px; height: 44px; font-size: 20px; }
            .filter-row { flex-direction: column; }
            .filter-group { min-width: 100%; }
            .apply-filters-btn, .clear-filters-btn { align-self: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-tabs">
            <button class="main-tab active" onclick="switchMainTab('movie')">🎬 Movies</button>
            <button class="main-tab" onclick="switchMainTab('tv')">📺 TV Shows</button>
        </div>

        <div id="movieSection" class="tab-content-section active">
            <div class="header">
                <div class="header-left">
                    <h1>🎬 My Movie Collection <span class="movie-count" id="movieCount">(0 movies)</span></h1>
                    <div class="last-updated">
                        <span class="sync-status loading" id="syncStatus">LOADING</span>
                        <span id="lastUpdatedText">Checking GitHub...</span>
                    </div>
                </div>
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
                <div class="header-buttons" id="headerButtons">
                    <button class="btn btn-secondary btn-small" onclick="refreshFromGitHub(); closeMobileMenu();">🔄 Refresh</button>
                    <button class="btn" onclick="openAddModal('movie'); closeMobileMenu();">+ Add Movie</button>
                    <button class="btn btn-success" onclick="exportAsJSON(); closeMobileMenu();">📄 Export JSON</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click(); closeMobileMenu();">📤 Import</button>
                    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
                </div>
            </div>
            <select class="genre-dropdown" id="movieGenreDropdown" onchange="filterByGenre(this.value,'movie')">
                <option value="all">🎭 All Genres</option>
            </select>
            <div class="controls">
                <input type="text" class="search-input" id="movieSearchInput" placeholder="Search your movies..." oninput="renderMovies()">
                <select class="sort-select" id="movieSortSelect" onchange="currentSort.movie=this.value; renderMovies();">
                    <option value="added-desc">Date Added (Newest)</option>
                    <option value="added-asc">Date Added (Oldest)</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                    <option value="year-desc">Year (Newest)</option>
                    <option value="year-asc">Year (Oldest)</option>
                    <option value="rating-desc">My Rating (High)</option>
                    <option value="rating-asc">My Rating (Low)</option>
                    <option value="tmdb-desc">TMDB Rating (High)</option>
                    <option value="tmdb-asc">TMDB Rating (Low)</option>
                </select>
            </div>
            <div class="genre-filter-bar" id="movieGenreFilterBar">
                <span class="genre-filter-label">🎭 Genres:</span>
                <button class="genre-chip active" data-genre="all" onclick="filterByGenre('all','movie')">All</button>
            </div>
            <div class="active-filter-notice" id="movieActiveFilterNotice">
                Showing: <strong id="movieActiveFilterText"></strong>
                <button onclick="clearFilters('movie')" style="background:none;border:none;color:#e50914;cursor:pointer;">✕ Clear</button>
            </div>
            <div class="movie-grid" id="movieGrid"></div>
        </div>

        <div id="tvSection" class="tab-content-section">
            <div class="header">
                <div class="header-left">
                    <h1>📺 My TV Shows <span class="movie-count" id="tvCount">(0 shows)</span></h1>
                    <div class="last-updated">
                        <span class="sync-status loading" id="tvSyncStatus">LOADING</span>
                        <span id="tvLastUpdatedText">Checking GitHub...</span>
                    </div>
                </div>
                <button class="mobile-menu-toggle" onclick="toggleMobileMenuTV()">☰</button>
                <div class="header-buttons" id="headerButtonsTV">
                    <button class="btn btn-secondary btn-small" onclick="refreshFromGitHub(); closeMobileMenuTV();">🔄 Refresh</button>
                    <button class="btn" onclick="openAddModal('tv'); closeMobileMenuTV();">+ Add TV Show</button>

                                <label>Min Rating</label>

                                    <option value="">Any</option>

                            </label>
                            <label class="filter-checkbox">

                            </label>

                                <input type="checkbox" id="filterExcludeAdded" checked> Hide already added

        <div class="modal-content">

    <div class="modal" id="actorModal">
        <div class="modal-content actor-modal-content">
            <button class="modal-close" onclick="document.getElementById('actorModal').classList.remove('active')">&times;</button>
            <div id="actorDetails"></div>
        </div>

    <script>
        // ============================================================
        // CONSTANTS & STATE
        // ============================================================
        const API_KEY = 'de4204747375f4d584fb254b6a94127c';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_ORIG = 'https://image.tmdb.org/t/p/original';
        const GITHUB_URL = 'https://raw.githubusercontent.com/grinningdog/testrun/main/movies.json';

        let movies = JSON.parse(localStorage.getItem('myMovies')) || [];
        let tvShows = JSON.parse(localStorage.getItem('myTVShows')) || [];
        let currentTab = 'movie';
        let currentSort = { movie: 'added-desc', tv: 'added-desc' };
        let currentGenreFilter = { movie: 'all', tv: 'all' };
        let addSearchTimeout, personSearchTimeout;
        let currentAddType = 'movie';
        let currentPersonMovies = [];
        let currentPersonId = null;
        let currentPersonName = null;

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================

        function showToast(msg, type = 'info', dur = 4000) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            toast.innerHTML = `<span class="toast-icon">${icons[type] || 'ℹ️'}</span><span class="toast-message">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, dur);
        }

        function fetchTO(url, timeout = 10000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
            ]);
        }

        function getList(type) {
            return type === 'movie' ? movies : tvShows;
        }

        function setList(type, list) {
            if (type === 'movie') {
                movies = list;
                localStorage.setItem('myMovies', JSON.stringify(list));
            } else {
                tvShows = list;
                localStorage.setItem('myTVShows', JSON.stringify(list));
            }
        }

        // ============================================================
        // TAB NAVIGATION
        // ============================================================

        function switchMainTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${tab}Section`).classList.add('active');
            if (tab === 'movie') {
                updateCount('movie');
                renderMovies();
                renderGF('movie');
                updateSyncDisplay('movie');
            } else {
                updateCount('tv');
                renderTV();
                renderGF('tv');
                updateSyncDisplay('tv');
            }
        }

        function switchAddTab(tab) {
            document.querySelectorAll('#addModal .tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('#addModal .tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tab}Tab`).classList.add('active');
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================

        function toggleMobileMenu() {
            const buttons = document.getElementById('headerButtons');
            const toggle = document.querySelector('#movieSection .mobile-menu-toggle');
            buttons.classList.toggle('show');
            toggle.textContent = buttons.classList.contains('show') ? '✕' : '☰';
        }

        function closeMobileMenu() {
            const buttons = document.getElementById('headerButtons');
            const toggle = document.querySelector('#movieSection .mobile-menu-toggle');
            buttons.classList.remove('show');
            toggle.textContent = '☰';
        }

        function toggleMobileMenuTV() {
            const buttons = document.getElementById('headerButtonsTV');
            const toggle = document.querySelector('#tvSection .mobile-menu-toggle');
            buttons.classList.toggle('show');
            toggle.textContent = buttons.classList.contains('show') ? '✕' : '☰';
        }

        function closeMobileMenuTV() {
            const buttons = document.getElementById('headerButtonsTV');
            const toggle = document.querySelector('#tvSection .mobile-menu-toggle');
            buttons.classList.remove('show');
            toggle.textContent = '☰';
        }

        // ============================================================
        // SYNC STATUS DISPLAY (FIXED - uses correct capitalization)
        // ============================================================

        function updateSyncDisplay(type) {
            const statusId = type === 'tv' ? 'tvSyncStatus' : 'syncStatus';
            const textId = type === 'tv' ? 'tvLastUpdatedText' : 'lastUpdatedText';
            const statusEl = document.getElementById(statusId);
            const textEl = document.getElementById(textId);
            const count = type === 'tv' ? tvShows.length : movies.length;

            if (statusEl) {
                statusEl.className = 'sync-status ok';
                statusEl.textContent = 'OK';
            }
            if (textEl) {
                textEl.textContent = `${count} ${type === 'tv' ? 'shows' : 'movies'} loaded`;
            }
        }

        // ============================================================
        // GITHUB SYNC (Smart sync - only overwrite if GitHub has more)
        // ============================================================

        async function loadFromGitHub(show = true) {
            try {
                const response = await fetchTO(`${GITHUB_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                // Smart sync: only overwrite if GitHub has MORE or EQUAL items
                if (data.movies && Array.isArray(data.movies)) {
                    if (data.movies.length >= movies.length) {
                        movies = data.movies;
                        localStorage.setItem('myMovies', JSON.stringify(movies));
                    }
                    updateCount('movie');
                    renderMovies();
                    renderGF('movie');
                }
                if (data.tvShows && Array.isArray(data.tvShows)) {
                    if (data.tvShows.length >= tvShows.length) {
                        tvShows = data.tvShows;
                        localStorage.setItem('myTVShows', JSON.stringify(tvShows));
                    }
                    updateCount('tv');
                    renderTV();
                    renderGF('tv');
                }

                updateSyncDisplay('movie');
                updateSyncDisplay('tv');

                if (show) showToast('✅ Loaded from GitHub', 'success');
            } catch (error) {
                console.error(error);
                if (show) showToast(`❌ ${error.message}`, 'error', 8000);
            }
        }

        async function refreshFromGitHub() {
            showToast('🔄 Checking...', 'info');
            await loadFromGitHub(true);
        }

        // ============================================================
        // EXPORT / IMPORT
        // ============================================================

        function exportAsJSON() {
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                movies: movies,
                tvShows: tvShows
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'movies.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast(`📄 Exported ${movies.length} movies, ${tvShows.length} shows`, 'success');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.movies && Array.isArray(data.movies)) {
                        movies = data.movies;
                        localStorage.setItem('myMovies', JSON.stringify(movies));
                    }
                    if (data.tvShows && Array.isArray(data.tvShows)) {
                        tvShows = data.tvShows;
                        localStorage.setItem('myTVShows', JSON.stringify(tvShows));
                    }
                    updateCount('movie');
                    updateCount('tv');
                    renderMovies();
                    renderTV();
                    renderGF('movie');
                    renderGF('tv');
                    updateSyncDisplay('movie');
                    updateSyncDisplay('tv');
                    showToast('✅ Imported', 'success');
                } catch (error) {
                    showToast(`❌ ${error.message}`, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // COUNTS, FILTERS, GENRES
        // ============================================================

        function updateCount(type) {
            const list = getList(type);
            const id = type === 'movie' ? 'movieCount' : 'tvCount';
            const label = type === 'movie' ? 'movie' : 'show';
            document.getElementById(id).textContent = `(${list.length} ${label}${list.length !== 1 ? 's' : ''})`;
        }

        function filterByGenre(genre, type) {
            currentGenreFilter[type] = genre;
            const bar = document.getElementById(`${type}GenreFilterBar`);
            if (bar) {
                bar.querySelectorAll('.genre-chip').forEach(chip => {
                    chip.classList.toggle('active', chip.dataset.genre === genre);
                });
            }
            const dropdown = document.getElementById(`${type}GenreDropdown`);
            if (dropdown) dropdown.value = genre;
            const notice = document.getElementById(`${type}ActiveFilterNotice`);
            const text = document.getElementById(`${type}ActiveFilterText`);
            if (genre === 'all') {
                notice.classList.remove('show');
            } else {
                text.textContent = `Genre: ${genre}`;
                notice.classList.add('show');
            }
            if (type === 'movie') renderMovies();
            else renderTV();
        }

        function clearFilters(type) {
            filterByGenre('all', type);
            document.getElementById(`${type}SearchInput`).value = '';
        }

        function getAllGenres(type) {
            const genreSet = new Set();
            getList(type).forEach(item => {
                if (item.genres) item.genres.forEach(g => genreSet.add(g));
            });
            return Array.from(genreSet).sort();
        }

        function renderGF(type) {
            const bar = document.getElementById(`${type}GenreFilterBar`);
            const dropdown = document.getElementById(`${type}GenreDropdown`);
            const genres = getAllGenres(type);

            if (bar) {
                bar.innerHTML = '<span class="genre-filter-label">🎭 Genres:</span>';
                const allChip = document.createElement('button');
                allChip.className = `genre-chip ${currentGenreFilter[type] === 'all' ? 'active' : ''}`;
                allChip.dataset.genre = 'all';
                allChip.onclick = () => filterByGenre('all', type);
                allChip.textContent = 'All';
                bar.appendChild(allChip);

                genres.forEach(genre => {
                    const chip = document.createElement('button');
                    chip.className = `genre-chip ${currentGenreFilter[type] === genre ? 'active' : ''}`;
                    chip.dataset.genre = genre;
                    chip.onclick = () => filterByGenre(genre, type);
                    chip.textContent = genre;
                    bar.appendChild(chip);
                });
            }

            if (dropdown) {
                dropdown.innerHTML = '<option value="all">🎭 All Genres</option>';
                genres.forEach(genre => {
                    const option = document.createElement('option');
                    option.value = genre;
                    option.textContent = genre;
                    dropdown.appendChild(option);
                });
                dropdown.value = currentGenreFilter[type];
            }
        }

        // ============================================================
        // SORTING
        // ============================================================

        function sortItems(list, type) {
            const [field, direction] = currentSort[type].split('-');
            const multiplier = direction === 'asc' ? 1 : -1;
            return [...list].sort((a, b) => {
                switch (field) {
                    case 'title':
                        return (a.title || '').toLowerCase().localeCompare((b.title || '').toLowerCase()) * multiplier;
                    case 'year':
                        const yearA = a.release_date ? new Date(a.release_date).getFullYear() : 0;
                        const yearB = b.release_date ? new Date(b.release_date).getFullYear() : 0;
                        return (yearA - yearB) * multiplier;
                    case 'rating':
                        const ra = a.userRating || 0;
                        const rb = b.userRating || 0;
                        if (!ra && !rb) return 0;
                        if (!ra) return 1;
                        if (!rb) return -1;
                        return (ra - rb) * multiplier;
                    case 'tmdb':
                        return ((a.vote_average || 0) - (b.vote_average || 0)) * multiplier;
                    case 'added':
                        return (new Date(a.added).getTime() - new Date(b.added).getTime()) * multiplier;
                    default:
                        return 0;
                }
            });
        }

        // ============================================================
        // RENDERING
        // ============================================================

        function renderGrid(gridId, list, type) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = '';
            const query = document.getElementById(`${type}SearchInput`).value.toLowerCase();
            let filtered = list.filter(item => {
                const matchesSearch = (item.title || '').toLowerCase().includes(query);
                const matchesGenre = currentGenreFilter[type] === 'all' ||
                    (item.genres && item.genres.includes(currentGenreFilter[type]));
                return matchesSearch && matchesGenre;
            });
            filtered = sortItems(filtered, type);

            if (!filtered.length) {
                grid.innerHTML = `<div class="empty-state"><h2>${list.length === 0 ? `No ${type === 'movie' ? 'movies' : 'TV shows'} yet` : 'No matches'}</h2></div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetails(item.id, type);
                const year = item.release_date ? new Date(item.release_date).getFullYear() : '';
                const genres = item.genres && item.genres.length ? item.genres.slice(0, 3).join(' • ') : '';
                const rating = item.userRating ? `<div class="movie-card-rating">⭐ ${item.userRating}/5</div>` : '';
                const poster = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';

                card.innerHTML = `
                    <img src="${poster}" alt="${item.title}" loading="lazy">
                    ${rating}
                    <div class="movie-card-overlay">
                        <div class="movie-card-title">${item.title}</div>
                        <div class="movie-card-year">${year}</div>
                        ${genres ? `<div class="movie-card-genres">${genres}</div>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderMovies() { renderGrid('movieGrid', movies, 'movie'); }
        function renderTV() { renderGrid('tvGrid', tvShows, 'tv'); }

        // ============================================================
        // ADD MODAL
        // ============================================================

        function openAddModal(type) {
            currentAddType = type;
            document.getElementById('addModalTitle').textContent = type === 'movie' ? 'Add Movie' : 'Add TV Show';
            document.getElementById('addSearchInput').placeholder = type === 'movie' ? 'e.g., The Dark Knight...' : 'e.g., Breaking Bad...';
            document.getElementById('manualInputLabel').textContent = type === 'movie' ? 'TMDB Movie ID' : 'TMDB TV Show ID';
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addSearchInput').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addSearchInput').value = '';
            document.getElementById('manualIdInput').value = '';
            document.getElementById('addMessage').textContent = '';
            document.getElementById('addSearchResults').innerHTML = '';
            document.getElementById('personSearchInput').value = '';
            document.getElementById('personResults').innerHTML = '';
            document.getElementById('personResults').classList.remove('show');
            document.getElementById('personItemsSection').style.display = 'none';
            document.getElementById('personSearchForm').style.display = 'block';
            document.getElementById('personItemResults').innerHTML = '';
            currentPersonMovies = [];
            currentPersonId = null;
            currentPersonName = null;
        }

        function debouncedAddSearch() {
            clearTimeout(addSearchTimeout);
            addSearchTimeout = setTimeout(performAddSearch, 500);
        }

        async function performAddSearch() {
            const query = document.getElementById('addSearchInput').value.trim();
            const resultsDiv = document.getElementById('addSearchResults');
            if (query.length < 2) { resultsDiv.innerHTML = ''; return; }
            resultsDiv.innerHTML = '<div class="search-loading">Searching...</div>';
            try {
                const endpoint = currentAddType === 'movie' ? 'movie' : 'tv';
                const response = await fetch(`${BASE_URL}/search/${endpoint}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&page=1`);
                const data = await response.json();
                if (!data.results.length) {
                    resultsDiv.innerHTML = '<div class="search-no-results">No results</div>';
                    return;
                }
                resultsDiv.innerHTML = '';
                data.results.forEach(item => {
                    const added = getList(currentAddType).some(m => m.id === item.id);
                    const card = document.createElement('div');
                    card.className = 'search-result-item';
                    const poster = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/300x450?text=No+Image';
                    const year = (item.first_air_date || item.release_date) ? new Date(item.first_air_date || item.release_date).getFullYear() : 'N/A';
                    const title = item.title || item.name;
                    card.innerHTML = `
                        <img src="${poster}" alt="${title}">
                        <button class="add-btn-small ${added ? 'added' : ''}" onclick="event.stopPropagation();toggleAddItem(${item.id},this)">${added ? '✓ Added' : '+ Add'}</button>
                        <div class="search-result-info">
                            <div class="search-result-title">${title}</div>
                            <div class="search-result-year">${year}</div>
                        </div>
                    `;
                    card.onclick = (e) => {
                        if (!e.target.classList.contains('add-btn-small')) {
                            toggleAddItem(item.id, card.querySelector('.add-btn-small'));
                        }
                    };
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<div class="search-no-results">Error</div>';
            }
        }

        async function toggleAddItem(id, btn) {
            if (btn.classList.contains('added')) {
                setList(currentAddType, getList(currentAddType).filter(m => m.id !== id));
                updateCount(currentAddType);
                currentAddType === 'movie' ? renderMovies() : renderTV();
                btn.classList.remove('added');
                btn.textContent = '+ Add';
                showToast('🗑️ Removed', 'info');
            } else {
                try {
                    const endpoint = currentAddType === 'movie' ? 'movie' : 'tv';
                    const response = await fetch(`${BASE_URL}/${endpoint}/${id}?api_key=${API_KEY}`);
                    const item = await response.json();
                    const newItem = {
                        id: item.id,
                        title: item.title || item.name,
                        poster_path: item.poster_path,
                        release_date: item.release_date || item.first_air_date,
                        vote_average: item.vote_average,
                        genres: item.genres ? item.genres.map(g => g.name) : [],
                        userRating: null,
                        added: new Date().toISOString()
                    };
                    if (!getList(currentAddType).some(m => m.id === id)) {
                        const list = getList(currentAddType);
                        list.push(newItem);
                        setList(currentAddType, list);
                        updateCount(currentAddType);
                        currentAddType === 'movie' ? renderMovies() : renderTV();
                    }
                    btn.classList.add('added');
                    btn.textContent = '✓ Added';
                    showToast(`✅ Added "${item.title || item.name}"`, 'success');
                } catch (error) {
                    showToast('❌ Error', 'error');
                }
            }
        }

        async function addManual() {
            const id = document.getElementById('manualIdInput').value.trim();
            const message = document.getElementById('addMessage');
            if (!id) {
                message.style.color = '#ff6b6b';
                message.textContent = 'Enter an ID';
                return;
            }
            message.textContent = 'Loading...';
            message.style.color = '#888';
            try {
                const endpoint = currentAddType === 'movie' ? 'movie' : 'tv';
                const response = await fetch(`${BASE_URL}/${endpoint}/${id}?api_key=${API_KEY}`);
                if (!response.ok) throw new Error();
                const item = await response.json();
                const newItem = {
                    id: item.id,
                    title: item.title || item.name,
                    poster_path: item.poster_path,
                    release_date: item.release_date || item.first_air_date,
                    vote_average: item.vote_average,
                    genres: item.genres ? item.genres.map(g => g.name) : [],
                    userRating: null,
                    added: new Date().toISOString()
                };
                if (!getList(currentAddType).some(x => x.id === id)) {
                    const list = getList(currentAddType);
                    list.push(newItem);
                    setList(currentAddType, list);
                    updateCount(currentAddType);
                    currentAddType === 'movie' ? renderMovies() : renderTV();
                }
                message.textContent = '';
                closeAddModal();
                showToast(`✅ Added "${item.title || item.name}"`, 'success');
            } catch (error) {
                message.style.color = '#ff6b6b';
                message.textContent = 'Not found';
            }
        }

        // ============================================================
        // PERSON / ACTOR SEARCH
        // ============================================================

        function debouncedPersonSearch() {
            clearTimeout(personSearchTimeout);
            personSearchTimeout = setTimeout(searchPerson, 500);
        }

        async function searchPerson() {
            const query = document.getElementById('personSearchInput').value.trim();
            const personResults = document.getElementById('personResults');
            const personSection = document.getElementById('personItemsSection');
            if (query.length < 2) {
                personResults.innerHTML = '';
                personResults.classList.remove('show');
                personSection.style.display = 'none';
                return;
            }
            personResults.innerHTML = '<div class="search-loading">Searching...</div>';
            personResults.classList.add('show');
            personSection.style.display = 'none';
            try {
                const response = await fetch(`${BASE_URL}/search/person?api_key=${API_KEY}&query=${encodeURIComponent(query)}&page=1`);
                const data = await response.json();
                if (!data.results.length) {
                    personResults.innerHTML = '<div class="search-no-results">No people found</div>';
                    return;
                }
                personResults.innerHTML = '';
                data.results.slice(0, 5).forEach(person => {
                    const card = document.createElement('div');
                    card.className = 'person-result-item';
                    card.onclick = () => loadPersonItems(person.id, person.name);
                    const img = person.profile_path ? `https://image.tmdb.org/t/p/w300${person.profile_path}` : 'https://via.placeholder.com/185x185?text=No+Image';
                    card.innerHTML = `
                        <img src="${img}" alt="${person.name}">
                        <div class="person-result-info">
                            <div class="person-result-name">${person.name}</div>
                            <div class="person-result-known">${person.known_for_department || 'Acting'}</div>
                        </div>
                    `;
                    personResults.appendChild(card);
                });
            } catch (error) {
                personResults.innerHTML = '<div class="search-no-results">Error</div>';
            }
        }

        async function loadPersonItems(personId, personName) {
            currentPersonId = personId;
            currentPersonName = personName;
            const movieResults = document.getElementById('personItemResults');
            const personSection = document.getElementById('personItemsSection');
            const personTitle = document.getElementById('personItemsTitle');
            const addAllBtn = document.getElementById('addAllBtn');
            const personResults = document.getElementById('personResults');
            const personForm = document.getElementById('personSearchForm');

            personResults.classList.remove('show');
            personForm.style.display = 'none';
            personSection.style.display = 'flex';
            personTitle.textContent = `${currentAddType === 'movie' ? 'Movies' : 'TV Shows'} featuring ${personName}`;
            movieResults.innerHTML = '<div class="search-loading">Loading...</div>';
            addAllBtn.disabled = true;

            try {
                const creditsEndpoint = currentAddType === 'movie' ? 'movie_credits' : 'tv_credits';
                const response = await fetch(`${BASE_URL}/person/${personId}/${creditsEndpoint}?api_key=${API_KEY}`);
                const data = await response.json();
                const items = data.cast || [];
                let unique = [...items].filter((m, i, a) => a.findIndex(x => x.id === m.id) === i);
                unique = applyPersonFilters(unique);
                unique.sort((a, b) => {
                    const dateA = (a.release_date || a.first_air_date) ? new Date(a.release_date || a.first_air_date) : new Date(0);
                    const dateB = (b.release_date || b.first_air_date) ? new Date(b.release_date || b.first_air_date) : new Date(0);
                    return dateB - dateA;
                });
                currentPersonMovies = unique;

                if (!unique.length) {
                    movieResults.innerHTML = '<div class="search-no-results">No results matching filters</div>';
                    addAllBtn.disabled = true;
                    return;
                }

                movieResults.innerHTML = '';
                unique.forEach(item => {
                    const added = getList(currentAddType).some(m => m.id === item.id);
                    const card = document.createElement('div');
                    card.className = 'search-result-item';
                    const poster = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/300x450?text=No+Image';
                    const year = (item.release_date || item.first_air_date) ? new Date(item.release_date || item.first_air_date).getFullYear() : 'N/A';
                    const title = item.title || item.name;
                    card.innerHTML = `
                        <img src="${poster}" alt="${title}">
                        <button class="add-btn-small ${added ? 'added' : ''}" onclick="event.stopPropagation();toggleAddItem(${item.id},this)">${added ? '✓ Added' : '+ Add'}</button>
                        <div class="search-result-info">
                            <div class="search-result-title">${title}</div>
                            <div class="search-result-year">${year} ${item.vote_average ? `• ⭐ ${item.vote_average.toFixed(1)}` : ''}</div>
                        </div>
                    `;
                    card.onclick = (e) => {
                        if (!e.target.classList.contains('add-btn-small')) {
                            toggleAddItem(item.id, card.querySelector('.add-btn-small'));
                        }
                    };
                    movieResults.appendChild(card);
                });
                updateAddAllBtn();
            } catch (error) {
                movieResults.innerHTML = '<div class="search-no-results">Error</div>';
                addAllBtn.disabled = true;
            }
        }

        function applyPersonFilters(items) {
            const yearFrom = document.getElementById('filterYearFrom')?.value;
            const yearTo = document.getElementById('filterYearTo')?.value;
            const minRating = document.getElementById('filterMinRating')?.value;
            const excludeCompilations = document.getElementById('filterExcludeCompilations')?.checked;
            const excludeDocumentaries = document.getElementById('filterExcludeDocumentaries')?.checked;
            const excludeAdded = document.getElementById('filterExcludeAdded')?.checked;

            return items.filter(item => {
                const year = (item.release_date || item.first_air_date) ? new Date(item.release_date || item.first_air_date).getFullYear() : null;
                const rating = item.vote_average || 0;
                const title = (item.title || item.name || '').toLowerCase();
                if (yearFrom && year && year < parseInt(yearFrom)) return false;
                if (yearTo && year && year > parseInt(yearTo)) return false;
                if (minRating && rating < parseFloat(minRating)) return false;
                if (excludeCompilations && (title.includes('compilation') || title.includes('best of') || title.includes('collection'))) return false;
                if (excludeDocumentaries && (title.includes('documentary') || title.includes('making of'))) return false;
                if (excludeAdded && getList(currentAddType).some(x => x.id === item.id)) return false;
                return true;
            });
        }

        function clearPersonFilters() {
            document.getElementById('filterYearFrom').value = '';
            document.getElementById('filterYearTo').value = '';
            document.getElementById('filterMinRating').value = '';
            document.getElementById('filterExcludeCompilations').checked = false;
            document.getElementById('filterExcludeDocumentaries').checked = false;
            document.getElementById('filterExcludeAdded').checked = false;
            if (currentPersonId) loadPersonItems(currentPersonId, currentPersonName);
        }

        function updateAddAllBtn() {
            const btn = document.getElementById('addAllBtn');
            const toAdd = currentPersonMovies.filter(m => !getList(currentAddType).some(x => x.id === m.id));
            btn.disabled = !toAdd.length;
            btn.textContent = toAdd.length ? `Add All (${toAdd.length})` : 'All Added ✓';
        }

        async function addAllVisibleItems() {
            const btn = document.getElementById('addAllBtn');
            const toAdd = currentPersonMovies.filter(m => !getList(currentAddType).some(x => x.id === m.id));
            if (!toAdd.length) return;
            btn.disabled = true;
            btn.textContent = 'Adding...';
            for (const m of toAdd) {
                try {
                    const endpoint = currentAddType === 'movie' ? 'movie' : 'tv';
                    const response = await fetch(`${BASE_URL}/${endpoint}/${m.id}?api_key=${API_KEY}`);
                    const item = await response.json();
                    if (!getList(currentAddType).some(x => x.id === item.id)) {
                        const newItem = {
                            id: item.id,
                            title: item.title || item.name,
                            poster_path: item.poster_path,
                            release_date: item.release_date || item.first_air_date,
                            vote_average: item.vote_average,
                            genres: item.genres ? item.genres.map(g => g.name) : [],
                            userRating: null,
                            added: new Date().toISOString()
                        };
                        const list = getList(currentAddType);
                        list.push(newItem);
                        setList(currentAddType, list);
                    }
                } catch (error) {
                    console.error(error);
                }
            }
            updateCount(currentAddType);
            currentAddType === 'movie' ? renderMovies() : renderTV();
            renderGF(currentAddType);
            updateAddAllBtn();
            showToast(`✅ Added ${toAdd.length}`, 'success');
        }

        // ============================================================
        // DETAILS MODAL
        // ============================================================

        async function showDetails(id, type) {
            const modal = document.getElementById('detailsModal');
            const content = document.getElementById('detailsContent');
            content.innerHTML = '<p style="text-align:center;padding:40px;color:#888;">Loading...</p>';
            modal.classList.add('active');

            try {
                const endpoint = type === 'movie' ? 'movie' : 'tv';
                const itemResponse = await fetch(`${BASE_URL}/${endpoint}/${id}?api_key=${API_KEY}`);
                const item = await itemResponse.json();

                // Fetch Wikipedia link via Wikidata
                let wikiLink = '';
                try {
                    const externalIds = await (await fetch(`${BASE_URL}/${endpoint}/${id}/external_ids?api_key=${API_KEY}`)).json();
                    if (externalIds.wikidata_id) {
                        try {
                            const wikidata = await (await fetch(`https://www.wikidata.org/wiki/Special:EntityData/${externalIds.wikidata_id}.json`)).json();
                            const entity = Object.values(wikidata.entities)[0];
                            if (entity?.sitelinks?.enwiki) {
                                wikiLink = `https://en.wikipedia.org/wiki/${entity.sitelinks.enwiki.title}`;
                            }
                        } catch (e) { }
                    }
                } catch (e) { }

                const creditsResponse = await fetch(`${BASE_URL}/${endpoint}/${id}/credits?api_key=${API_KEY}`);
                const credits = await creditsResponse.json();
                const local = getList(type).find(m => m.id === id);
                const userRating = local ? local.userRating : null;
                const year = (item.first_air_date || item.release_date) ? new Date(item.first_air_date || item.release_date).getFullYear() : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const runtime = type === 'movie'
                    ? (item.runtime ? `${item.runtime} min` : '')
                    : (item.episode_run_time?.length ? `${item.episode_run_time[0]} min/ep` : '');

                const actors = (credits.cast || []).slice(0, 8);
                let actorsHTML = '';
                if (actors.length) {
                    actorsHTML = '<div class="movie-actors"><span class="movie-actors-label">Starring:</span>';
                    actors.forEach((actor, i) => {
                        const safeName = actor.name.replace(/'/g, "\\'");
                        const safeProfile = actor.profile_path ? actor.profile_path.replace(/'/g, "\\'") : '';
                        actorsHTML += `<span class="actor-chip" onclick="event.stopPropagation();showActorDetails(${actor.id},'${safeName}','${safeProfile}','${(actor.character || '').replace(/'/g, "\\'")}')"> ${actor.name}</span>`;
                        if (i < actors.length - 1) actorsHTML += '<span class="actor-separator">•</span>';
                    });
                    actorsHTML += '</div>';
                }

                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    starsHTML += `<span class="star ${userRating && i <= userRating ? 'filled' : ''}" onclick="setUserRating(${id},${i},'${type}')" onmouseover="previewRating(${i})" onmouseout("clearPreview()">${i <= (userRating || 0) ? '★' : '☆'}</span>`;
                }

                let tvInfo = '';
                if (type === 'tv') {
                    const seasons = item.number_of_seasons || 0;
                    const episodes = item.number_of_episodes || 0;
                    const status = item.status || '';
                    const network = item.networks?.length ? item.networks[0].name : '';
                    tvInfo = `<div style="color:#888;font-size:14px;margin-top:10px;">
                        ${seasons ? `${seasons} season${seasons > 1 ? 's' : ''}` : ''}
                        ${episodes ? ` • ${episodes} episode${episodes > 1 ? 's' : ''}` : ''}
                        ${status ? ` • ${status}` : ''}
                        ${network ? ` • ${network}` : ''}
                    </div>`;
                }

                const wikipediaHTML = wikiLink
                    ? `<div style="margin-top:10px;"><a href="${wikiLink}" target="_blank" style="color:#4dd0e1;text-decoration:none;font-size:14px;border-bottom:1px dotted #4dd0e1;">Wikipedia</a></div>`
                    : '<div style="margin-top:10px;"><span style="color:#666;font-size:14px;">Wikipedia</span></div>';

                content.innerHTML = `
                    ${item.poster_path ? `<img src="${IMG_ORIG}${item.poster_path}" alt="${item.title || item.name}">` : ''}
                    <h2>${item.title || item.name}</h2>
                    <div class="movie-meta">
                        <span>📅 ${year}</span>
                        <span class="movie-rating">⭐ ${rating}/10 (TMDB)</span>
                        ${runtime ? `<span>⏱️ ${runtime}</span>` : ''}
                    </div>
                    ${tvInfo}
                    ${wikipediaHTML}
                    ${item.genres?.length ? `<div style="color:#888;font-size:14px;">${item.genres.map(g => g.name).join(' • ')}</div>` : ''}
                    ${actorsHTML}
                    <div class="movie-synopsis"><strong>Synopsis:</strong><br>${item.overview || 'No synopsis available.'}</div>
                    <div class="user-rating-section">
                        <div class="user-rating-label">Your Rating:</div>
                        <div class="star-rating" id="starRating">
                            ${starsHTML}
                            <span class="rating-text" id="ratingText">${userRating ? `You rated this ${userRating}/5` : 'Not rated yet'}</span>
                            ${userRating ? `<button class="clear-rating" onclick="clearUserRating(${id},'${type}')">Clear</button>` : ''}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${id},'${type}')">Remove from Collection</button>
                `;
            } catch (error) {
                content.innerHTML = '<p style="text-align:center;color:#ff6b6b;">Error</p>';
            }
        }

        function setUserRating(id, rating, type) {
            const list = getList(type);
            const item = list.find(m => m.id === id);
            if (!item) return;
            item.userRating = rating;
            setList(type, list);
            document.querySelectorAll('#starRating .star').forEach((star, index) => {
                star.classList.toggle('filled', index < rating);
                star.textContent = index < rating ? '★' : '☆';
            });
            document.getElementById('ratingText').textContent = `You rated this ${rating}/5`;
            const ratingDiv = document.getElementById('starRating');
            if (!ratingDiv.querySelector('.clear-rating')) {
                const button = document.createElement('button');
                button.className = 'clear-rating';
                button.textContent = 'Clear';
                button.onclick = () => clearUserRating(id, type);
                ratingDiv.appendChild(button);
            }
            type === 'movie' ? renderMovies() : renderTV();
        }

        function clearUserRating(id, type) {
            const list = getList(type);
            const item = list.find(m => m.id === id);
            if (!item) return;
            item.userRating = null;
            setList(type, list);
            showDetails(id, type);
        }

        function previewRating(value) {
            document.querySelectorAll('#starRating .star').forEach((star, index) => {
                star.classList.toggle('hover-preview', index < value);
            });
        }

        function clearPreview() {
            document.querySelectorAll('#starRating .star').forEach(star => star.classList.remove('hover-preview'));
        }

        function deleteItem(id, type) {
            if (confirm('Remove from collection?')) {
                setList(type, getList(type).filter(m => m.id !== id));
                updateCount(type);
                type === 'movie' ? renderMovies() : renderTV();
                closeDetailsModal();
                showToast('🗑️ Removed', 'info');
            }
        }

        function showActorDetails(id, name, profile, character) {
            const modal = document.getElementById('actorModal');
            const details = document.getElementById('actorDetails');
            const img = profile ? `https://image.tmdb.org/t/p/w300${profile}` : 'https://via.placeholder.com/300x300?text=No+Image';
            const characterHTML = character && character.trim() ? `<div class="actor-character">as "${character}"</div>` : '';
            details.innerHTML = `
                <div class="actor-details">
                    <img src="${img}" alt="${name}">
                    <h2>${name}</h2>
                    ${characterHTML}
                    <a href="https://www.themoviedb.org/person/${id}" target="_blank" class="actor-tmdb-link">More details at The Movie Database</a>
                </div>
            `;
            modal.classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================

        async function init() {
            document.getElementById('movieSortSelect').value = currentSort.movie;
            document.getElementById('tvSortSelect').value = currentSort.tv;

            document.addEventListener('click', (e) => {
                ['headerButtons', 'headerButtonsTV'].forEach(id => {
                    const buttons = document.getElementById(id);
                    if (buttons?.classList.contains('show') && !buttons.contains(e.target) && !e.target.classList.contains('mobile-menu-toggle')) {
                        buttons.classList.remove('show');
                        const toggle = buttons.parentElement.querySelector('.mobile-menu-toggle');
                        if (toggle) toggle.textContent = '☰';
                    }
                });
            });

            await loadFromGitHub(false);
            updateCount('movie');
            updateCount('tv');
            renderMovies();
            renderTV();
            renderGF('movie');
            renderGF('tv');
            updateSyncDisplay('movie');
            updateSyncDisplay('tv');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            }
        });

        window.onclick = (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        };
    </script>
