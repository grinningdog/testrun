<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Private writer's reference tool for The Griffin Universe Bible">
  <title>The Griffin Universe Bible</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <strong>Griffin Universe</strong>
          <span>Bible</span>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <button id="themeToggle" class="nav-button" title="Toggle light/dark mode">☼ <span>Light mode</span></button>
        <button id="backupButton" class="nav-button">⇩ <span>One-click backup</span></button>
        <button id="importButton" class="nav-button">⇧ <span>Import JSON</span></button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="sidebarToggle" class="icon-button" aria-label="Toggle navigation">☰</button>
        <div class="search-wrap">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search the universe…" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="top-actions">
          <span id="saveStatus" class="save-status">Saved</span>
          <button id="reportButton" class="secondary-button">Read-only report</button>
          <button id="printButton" class="secondary-button">Print / PDF</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Edit</h2>
        <button class="icon-button" data-close-modal aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
